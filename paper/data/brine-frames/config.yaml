# Local copy of the Hugging Face dataset d-SEAMS/brine-front-230K.
# brine_dataset mirrors hf_revision here; brine_run adds its restarts and
# brine_frame its labelled frames in the same layout. Pass
# dataset=/path/to/copy to use another one. /d-SEAMS/ is gitignored.
dataset: d-SEAMS/brine-front-230K
hf_dataset: d-SEAMS/brine-front-230K
hf_revision: 4828e33ecf419c70643b2d466bfa4f283b4138dc
python: python3
render_python: python3
lmp: lmp
genice: genice2
seams: seams
lib: libyodaLib.so
# Runs that the dataset revision lacks, and the OpenMP threads of each.
# T240 and T245 are replica r0 at the campaign's warm temperatures.
# Snakemake --cores 8 runs the four 2-thread loadings together; the two
# 4-thread runs fill the cores the last 2-thread runs leave.
runs:
  T230_m10_r0: 8
  T230_m0_r1: 2
  T230_m10_r1: 2
  T230_m20_r1: 2
  T230_m40_r1: 2
  T240_m0_r0: 2
  T240_m20_r0: 2
  T240_m40_r0: 2
  T245_m0_r0: 2
  T245_m20_r0: 4
  T245_m40_r0: 4
# true: brine_replicas also reads the brine_run frames hf_revision lacks.
with_runs: false
# LAMMPS timer cap on each run command. The campaign capped a 6 h wall at
# 5:40:00; this cap is long enough for 5 ns at 2 threads.
lmp_timeout: "40:00:00"
# Scratch for brine_run, gitignored with out/.
work: paper/data/brine-frames/out/runs
