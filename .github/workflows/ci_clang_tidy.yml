name: Static analysis
on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-tidy-
      - name: Install clang-tidy and Clang OpenMP
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy libomp-dev
      - name: Export compile commands
        run: pixi run meson setup build-tidy -Dwith_tests=false -Dwith_python=false
      - name: Run clang-tidy
        run: bash scripts/clang_tidy_src.sh build-tidy
