name: Docs
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: docs
          cache-key: pixi-docs-
      - name: Python numpydoc
        run: pixi run -e docs python -m pip install numpydoc

      - name: C++ and Lua API docs
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen lua-ldoc lua5.2
          doxygen docs/Doxyfile.lang
          ldoc --fatalwarnings -c docs/config.ld bindings/lua/dseams.lua

      - name: Build the library the examples call
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-

      - name: Language runtimes
        run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev r-base-core gfortran pandoc devscripts texlive-latex-base texlive-latex-recommended texlive-fonts-recommended xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - run: pixi run -e default setup
      - run: pixi run -e default build

      - name: Cache the brine frames and the renderer wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docs/.cache/brine-front-230K
            ~/.cache/pip
          key: docs-xvfb-ovito-${{ runner.os }}-brine-4828e33ecf419c70643b2d466bfa4f283b4138dc

      - name: Headless molecule renderer and OpenMM
        run: pixi run -e default python -m pip install ovito pillow openmm

      - name: Xvfb and software Vulkan
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=xcb" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Ice Ih, language APIs, and science tutorials
        run: DOCS_CI=1 pixi run -e default meson test -C bbdir docs_core_counts docs_capi_examples docs_capi_symbols docs_binding_docstrings docs_lang_ice docs_science_render_copy docs_science_tutorials docs_engine_walkthrough --print-errorlogs

      - run: pixi run -e docs docbld

      - name: Link check
        run: pixi run -e docs sphinx-build -W --keep-going -b linkcheck -d docs/doctrees docs/source docs/linkcheck

      - name: Julia Documenter
        run: |
          export SEAMS_LANG_LIB="$PWD/bbdir/bindings/libseams_lang.so"
          export SEAMS_LIB="$PWD/bbdir/src/libseams.so"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          julia --project=bindings/julia/Dseams/docs bindings/julia/Dseams/docs/make.jl
          julia --project=bindings/julia/Seams/docs bindings/julia/Seams/docs/make.jl

      - name: R CMD check
        run: |
          export DSEAMS_ROOT="$PWD"
          export SEAMS_INCLUDE="$PWD/bindings/cxx"
          export SEAMS_LIBDIR="$PWD/bbdir/bindings"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export TEXINPUTS="$PWD/docs/tex//:${TEXINPUTS:-}"
          Rscript -e 'install.packages(c("cpp11","roxygen2","testthat","knitr","rmarkdown"), repos="https://cloud.r-project.org")'
          R CMD build bindings/r/dseams
          R CMD check --as-cran dseams_*.tar.gz
          log=$(echo dseams.Rcheck/00check.log)
          if grep -E 'Undocumented (code objects|arguments|datasets)' "$log"; then
            echo "R check reported undocumented objects"
            exit 1
          fi

      - name: Python doctest
        run: |
          export SEAMS_LIBDIR="$PWD/bbdir/src"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pixi run -e docs sphinx-build -W --keep-going -b doctest -d docs/doctrees docs/source docs/doctest

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
