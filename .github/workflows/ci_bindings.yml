name: Bindings
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-bindings-rust-
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build libseams
        run: |
          pixi run meson setup bbdir-rust -Dwith_python=false -Dwith_tests=true -Dwith_cli=false
          pixi run ninja -C bbdir-rust src/libseams.so bindings/binding_oracle
      - name: Test the safe crate
        run: |
          export SEAMS_LIB_DIR="$PWD/bbdir-rust/src"
          export LD_LIBRARY_PATH="$SEAMS_LIB_DIR"
          export SEAMS_CPP_ORACLE="$PWD/bbdir-rust/bindings/binding_oracle"
          export SEAMS_SOURCE_ROOT="$PWD"
          export OMP_NUM_THREADS=1
          cargo fmt --manifest-path bindings/rust/Cargo.toml --all -- --check
          cargo clippy --offline --manifest-path bindings/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --offline --manifest-path bindings/rust/Cargo.toml -- --test-threads=1
          cargo test --offline --manifest-path bindings/rust/Cargo.toml --examples -- --test-threads=1
          cargo doc --offline --manifest-path bindings/rust/Cargo.toml --no-deps -p seams

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-bindings-cpp-
      - name: Build and test the C++ wrapper
        run: |
          pixi run meson setup bbdir-cpp -Dwith_python=false -Dwith_tests=true -Dwith_cli=false
          pixi run ninja -C bbdir-cpp bindings/test_seams_hpp src/docs_api_hpp
          pixi run meson test -C bbdir-cpp seams_hpp_match docs_api_hpp --print-errorlogs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest docs/tutorials -q

  r-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-bindings-
      - name: Install numpy and chemfiles
        run: |
          pip install numpy
          sudo apt-get update
          sudo apt-get install -y cmake g++
          curl -fsSL -o "$RUNNER_TEMP/chemfiles.tar.gz" https://github.com/chemfiles/chemfiles/archive/refs/tags/0.10.4.tar.gz
          tar -xzf "$RUNNER_TEMP/chemfiles.tar.gz" -C "$RUNNER_TEMP"
          patch -d "$RUNNER_TEMP/chemfiles-0.10.4" -p1 < cmake/patches/chemfiles-0.10.4-mmcif.patch
          cmake -S "$RUNNER_TEMP/chemfiles-0.10.4" -B "$RUNNER_TEMP/chemfiles-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/chemfiles-build" -j2
          sudo cmake --install "$RUNNER_TEMP/chemfiles-build"
          sudo ldconfig
      - run: pixi run meson setup bbdir-py -Dwith_python=false -Dwith_tests=true -Dwith_cli=true
      - run: pixi run ninja -C bbdir-py bindings/libseams_lang.so bindings/test_seams_lang
      - run: pixi run meson test -C bbdir-py seams_lang_fixtures chill_plus_ctypes symmetry_ctypes frames_abi --print-errorlogs
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-dev libuv1-dev
          export R_LIBS_USER="$HOME/R/library"
          mkdir -p "$R_LIBS_USER"
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); install.packages(c("cpp11", "testthat"), lib = lib, repos = "https://cloud.r-project.org"); for (p in c("cpp11", "testthat")) if (!requireNamespace(p, lib.loc = lib, quietly = TRUE)) quit(status = 1)'
      - name: Install the R package
        run: |
          export R_LIBS_USER="${R_LIBS_USER:-$HOME/R/library}"
          export SEAMS_INCLUDE="$PWD/bindings/cxx"
          export SEAMS_LIBDIR="$PWD/bbdir-py/bindings"
          export LD_LIBRARY_PATH="$SEAMS_LIBDIR:$PWD/bbdir-py/src:${LD_LIBRARY_PATH:-}"
          R CMD INSTALL -l "$R_LIBS_USER" bindings/r/dseams
      - name: Test R
        run: |
          export R_LIBS_USER="${R_LIBS_USER:-$HOME/R/library}"
          export DSEAMS_ROOT="$PWD"
          export LD_LIBRARY_PATH="$PWD/bbdir-py/bindings:$PWD/bbdir-py/src:${LD_LIBRARY_PATH:-}"
          Rscript -e 'testthat::test_file("bindings/r/dseams/tests/testthat/test-ice.R", stop_on_failure=TRUE)'
      - name: Install Julia
        run: |
          curl -fsSL -o "$RUNNER_TEMP/julia.tar.gz" https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.6-linux-x86_64.tar.gz
          sudo tar -xzf "$RUNNER_TEMP/julia.tar.gz" -C /opt
          echo /opt/julia-1.11.6/bin >> "$GITHUB_PATH"
      - name: Test Julia
        run: |
          export DSEAMS_ROOT="$PWD"
          export SEAMS_LANG_LIB="$PWD/bbdir-py/bindings/libseams_lang.so"
          export LD_LIBRARY_PATH="$PWD/bbdir-py/bindings:$PWD/bbdir-py/src:${LD_LIBRARY_PATH:-}"
          julia --project=bindings/julia/Dseams -e 'using Pkg; Pkg.instantiate()'
          julia --project=bindings/julia/Dseams bindings/julia/Dseams/test/runtests.jl
      - name: Install pydseamslib with chill_plus(graph=)
        run: pixi run python -m pip install "pydseamslib @ git+https://github.com/d-SEAMS/PydSEAMSlib@${PYDSEAMSLIB_REF:-main}"
      - name: Install Fortran and Rust
        run: |
          sudo apt-get install -y gfortran
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: CHILL+ agrees across the CLI, Python, R, and Julia
        run: |
          export R_LIBS_USER="${R_LIBS_USER:-$HOME/R/library}"
          export DSEAMS_ROOT="$PWD"
          export LD_LIBRARY_PATH="$PWD/bbdir-py/bindings:$PWD/bbdir-py/src:${LD_LIBRARY_PATH:-}"
          export SEAMS_REQUIRE_LANG=1
          pixi run ninja -C bbdir-py seams
          pixi run python tests/chill_plus_fronts.py bbdir-py/seams bbdir-py/bindings/libseams_lang.so --require-all
          pixi run sh tests/run_language_fronts.sh "$PWD/bbdir-py"
