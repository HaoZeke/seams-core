name: CI
on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-
      # The conda arm64-apple-darwin20.0.0 toolchain needs the macOS 11 SDK it
      # was built against: the runner's Xcode SDK is too new for the conda
      # ld64, whose TAPI parser then imports nothing from libSystem and every
      # target fails on libc symbols (_ungetc, __DefaultRuneLocale, ...)
      - name: Install the macOS 11.0 SDK for the conda compilers
        if: runner.os == 'macOS'
        run: |
          curl -sLO https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.0.sdk.tar.xz
          sudo tar -xf MacOSX11.0.sdk.tar.xz -C /opt
          echo "SDKROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
      - run: pixi run setup
      - run: pixi run build
      - run: pixi run test
      - run: pixi run install

  mpi:
    runs-on: ubuntu-latest
    env:
      # Hosted runners expose MANA devices without usable RDMA queues.
      UCX_TLS: tcp,self,sm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: mpi
          cache-key: pixi-mpi-
      - run: pixi run -e mpi meson setup bbdir-mpi -Dwith_mpi=enabled -Dwith_tests=true -Dwith_python=false
      - run: pixi run -e mpi ninja -C bbdir-mpi
      - run: pixi run -e mpi meson test -C bbdir-mpi --print-errorlogs domain domain_mpi seams_mpi_frames_match_serial

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-
          cache-write: false
      - run: pixi run coverage-setup
      - run: pixi run coverage-build
      - run: pixi run coverage-run
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: bbdir-cov/meson-logs/coverage.info
          fail_ci_if_error: false

  # The linux-64 pixi stack: engines, OVITO, GenIce, packmol, the paper
  # tutorials, and the language fronts. A skip fails the job.
  pixi-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-suite-
      - name: Add the R, Julia, and Rust fronts
        run: pixi add --platform linux-64 r-base julia rust
      - name: Install OVITO 3.17 and Snakemake into the pixi interpreter
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/wheels"
          mkdir -p "$dest"
          pixi run python -m pip download 'ovito==3.17.2' --no-deps --only-binary=:all: \
            --platform manylinux_2_34_x86_64 --python-version 312 \
            --implementation cp --abi cp312 -d "$dest"
          pixi run python -m pip install --force-reinstall --no-deps "$dest"/ovito-*.whl
          pixi run python -m pip install 'snakemake>=8' 'towncrier>=24'
      - name: Build and run the full suite
        run: pixi run bash scripts/ci_pixi_suite.sh
