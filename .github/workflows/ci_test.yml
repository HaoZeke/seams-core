name: CI
on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-
      # The conda arm64-apple-darwin20.0.0 toolchain needs the macOS 11 SDK it
      # was built against: the runner's Xcode SDK is too new for the conda
      # ld64, whose TAPI parser then imports nothing from libSystem and every
      # target fails on libc symbols (_ungetc, __DefaultRuneLocale, ...)
      - name: Install the macOS 11.0 SDK for the conda compilers
        if: runner.os == 'macOS'
        run: |
          curl -sLO https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.0.sdk.tar.xz
          sudo tar -xf MacOSX11.0.sdk.tar.xz -C /opt
          echo "SDKROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
      - run: pixi run setup
      - run: pixi run build
      - run: pixi run test
      - run: pixi run install

  mpi:
    runs-on: ubuntu-latest
    env:
      # Hosted runners expose MANA devices without usable RDMA queues.
      UCX_TLS: tcp,self,sm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: mpi
          cache-key: pixi-mpi-
      - run: pixi run -e mpi meson setup bbdir-mpi -Dwith_mpi=enabled -Dwith_tests=true -Dwith_python=false
      - run: pixi run -e mpi ninja -C bbdir-mpi
      - run: pixi run -e mpi meson test -C bbdir-mpi --print-errorlogs domain domain_mpi seams_mpi_frames_match_serial

  version-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that cog still emits the VERSION file
        run: |
          python3 -m pip install --user 'cogapp==3.6.0'
          python3 -m cogapp --check --check-fail-msg="Run cog -r from the repository root." \
            meson.build pixi.toml CITATION.cff nix/package.nix \
            docs/source/Doxyfile_seams.cfg bindings/julia/Dseams/Project.toml
          python3 -c 'from pathlib import Path; v=Path("VERSION").read_text().strip(); d=Path("RELEASE_DATE").read_text().strip(); h=next(l for l in Path("CHANGELOG.md").read_text().splitlines() if l.startswith("## [")); w="## [%s] - %s"%(v,d); assert h==w, (h,w)'
          # A release runs: towncrier build --version "$(cat VERSION)" --date "$(cat RELEASE_DATE)"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-
          cache-write: false
      - run: pixi run coverage-setup
      - run: pixi run coverage-build
      - run: pixi run coverage-run
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: bbdir-cov/meson-logs/coverage.info
          fail_ci_if_error: false
