name: Wheels
# pydseamslib on PyPI: the sdist, then wheels built from that sdist.
# Publishing runs only for a v* tag, through PyPI trusted publishing.
#
# Windows is not built: the engine uses GCC/Clang builtins and
# attributes (__builtin_cpu_supports, __attribute__((target))) that
# MSVC does not accept.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - meson.build
      - meson_options.txt
      - src/**
      - include/**
      - bindings/meson.build
      - bindings/cxx/**
      - bindings/python/**
      - subprojects/**
      - scripts/dist_strip_vcs.py
      - .github/workflows/wheels.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Install the sdist without fetching any subproject
        run: |
          python -m pip download -d buildreqs "meson-python>=0.18" "meson>=1.3" ninja numpy pytest
          python -m venv "$RUNNER_TEMP/sdist-venv"
          # nodownload: a subproject missing from the sdist fails the build
          # instead of being fetched; --no-index keeps pip offline too.
          "$RUNNER_TEMP/sdist-venv"/bin/python -m pip install --no-index --find-links buildreqs \
            --config-settings=setup-args=--wrap-mode=nodownload \
            dist/pydseamslib-*.tar.gz pytest
      - name: Test the sdist install
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/sdist-venv"/bin/python -c 'import dseams; print(dseams.__version__)'
          "$RUNNER_TEMP/sdist-venv"/bin/python -m pytest -q -p no:cacheprovider --import-mode=importlib \
            "$GITHUB_WORKSPACE/bindings/python/tests/test_dseams.py" \
            "$GITHUB_WORKSPACE/bindings/python/tests/installed_package.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    name: wheels ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 and musllinux_1_2, from pyproject.toml
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-14, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist
      - name: Locate the sdist
        id: sdist
        run: echo "path=$(ls sdist/pydseamslib-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Configure this environment and a trusted publisher for
    # d-SEAMS/seams-core, workflow wheels.yml, environment pypi, on
    # https://pypi.org/manage/project/pydseamslib/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/p/pydseamslib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
