[package]
name = "seams"
version = "2.14.0"
edition = "2021"
rust-version = "1.74"
description = "Safe Rust API for the d-SEAMS structural elucidation library"
license = "MIT"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
repository = "https://github.com/d-SEAMS/seams-core"
homepage = "https://dseams.info"
documentation = "https://docs.dseams.info/stable/rust.html"
keywords = ["molecular-dynamics", "ice", "chemistry", "simulation"]
categories = ["science"]

[dependencies]
seams-sys = { path = "../seams-sys" }

[[example]]
name = "minimal"
path = "../../../docs/examples/minimal_rust.rs"
