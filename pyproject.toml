[build-system]
requires = ["meson-python>=0.18", "meson>=1.3", "ninja"]
build-backend = "mesonpy"

[project]
name = "pydseamslib"
version = "2.14.0"
description = "Python bindings for the d-SEAMS C++ engine (import dseams)"
readme = "bindings/python/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ruhila S", email = "ruhiresearcher209@gmail.com" },
  { name = "Amrita Goswami", email = "amrita16thaug646@gmail.com" },
  { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
]
keywords = [
  "molecular dynamics", "trajectory analysis", "ice", "water",
  "clathrate hydrate", "nucleation", "topology", "primitive rings",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
ase = ["ase>=3.23"]
mdanalysis = ["MDAnalysis>=2.7"]

[project.urls]
Homepage = "https://dseams.info"
Documentation = "https://docs.dseams.info"
Repository = "https://github.com/d-SEAMS/seams-core"
Changelog = "https://github.com/d-SEAMS/seams-core/blob/main/CHANGELOG.md"

[tool.meson-python]
# Only takes effect with -Dpython.allow_limited_api=true, which the
# cp312 wheel build passes; that wheel is tagged cp312-abi3.
limited-api = true

[tool.meson-python.args]
# The wheel is the C++ engine with OpenMP and nothing that needs the
# network or a Rust toolchain at build time. Static subprojects and a
# static libyodaLib leave libseams and libseams_lang self-contained.
setup = [
  "-Dwith_python=true",
  "-Dwith_tests=false",
  "-Dwith_cli=false",
  "-Ddefault_library=static",
  "-Dpython.allow_limited_api=false",
  "-Dwith_blas=disabled",
  "-Dwith_chemfiles=disabled",
  "-Dwith_readcon=disabled",
  "-Dwith_linkcell=disabled",
  "-Dwith_minimage=disabled",
  "-Dwith_gpulite=disabled",
  "-Dwith_openmp_offload=disabled",
  "-Dwith_mpi=disabled",
  "-Dwith_lua=disabled",
  "-Dwith_lammps=disabled",
  "-Dwith_gromacs=disabled",
  "-Dwith_openmm=disabled",
  "-Dwith_plumed=disabled",
  "-Dwith_ira=disabled",
  "-Dwith_spglib=disabled",
  "-Dwith_sphericart=disabled",
  "-Dwith_nauty=disabled",
  "-Dwith_csm=disabled",
]
install = ["--tags=runtime,python-runtime"]
dist = ["--include-subprojects"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-win32", "*_i686", "*-musllinux_i686", "*_ppc64le", "*_s390x", "*_armv7l", "*_riscv64"]
build-frontend = "build"
build-verbosity = 1
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
test-requires = ["pytest"]
test-command = [
  "python -c \"import dseams, sys; print(dseams.__version__); sys.exit(dseams.__version__ != '2.14.0')\"",
  "python -m pytest -q -p no:cacheprovider --import-mode=importlib {project}/bindings/python/tests/test_dseams.py {project}/bindings/python/tests/installed_package.py",
]

# nanobind's stable ABI starts at 3.12, so one cp312-abi3 wheel serves
# 3.12 and later; 3.10 and 3.11 get version-specific wheels.
[[tool.cibuildwheel.overrides]]
select = "cp312-*"
config-settings = { "setup-args" = "-Dpython.allow_limited_api=true" }
inherit.config-settings = "append"

[tool.cibuildwheel.macos]
# libc++ in the engine needs floating-point std::to_chars (macOS 13.3);
# 14.0 matches the 2.11 wheels.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
