[build-system]
requires = ["meson-python>=0.16", "nanobind>=2.0", "numpy"]
build-backend = "mesonpy"

[project]
name = "dseams"
version = "2.14.0"
description = "d-SEAMS stable C API for Python"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.meson-python.args]
setup = ["-Dwith_python=true", "-Dwith_tests=false", "-Dwith_cli=false"]
